[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; version.txt is a plain, untyped file with no Godot importer and nothing
; preloads/loads it as a Resource — "all_resources" only follows files it
; recognizes as resources or can trace via static load()/preload() analysis,
; so a raw runtime FileAccess.open() read like UpdateChecker's isn't enough
; to get it swept in. Confirmed empirically: every other project file
; (scripts, scenes, theme, icon) shows up in the exported .pck; version.txt
; silently didn't, leaving UpdateChecker.current_version stuck at its "0.0.0"
; fallback in every exported build. include_filter force-adds it regardless.
include_filter="version.txt"
exclude_filter=""
export_path="dist/TelemetryView.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://app_icon.ico"
application/console_wrapper_icon="res://app_icon.ico"
application/icon_interpolation=4
application/file_version="1.0.0"
application/product_version="1.0.0"
application/company_name=""
application/product_name="Telemetry"
application/file_description="Racing telemetry dashboard"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
d3d12/agility_sdk_multizip=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'\nSTART /WAIT \"\" \"{temp_dir}\\{exe_name}\"\n"
ssh_remote_deploy/cleanup_script="Remove-Item -Recurse -Force '{temp_dir}'\n"
